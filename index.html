<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spin The Bottle Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Segoe UI,sans-serif;
  background:#0b0b0f;
  color:white;
  text-align:center;
}
h1{color:#ff7ad9;margin:16px}
button,input{
  padding:10px 14px;
  margin:6px;
  border-radius:8px;
  border:none;
  font-size:14px;
}
button{background:linear-gradient(135deg,#ff7ad9,#7c7cff);color:white}
input{background:#1a1a25;color:white;border:1px solid #ff7ad9}
.hidden{display:none}

.game-area{
  width:360px;height:360px;
  margin:16px auto;
  position:relative;
  border-radius:50%;
  background:conic-gradient(#ff7ad9,#7c7cff,#6dffb8,#ffd86d,#ff7ad9)
}
.bottle{
  position:absolute;
  top:50%;left:50%;
  width:140px;height:140px;
  background:url("https://i.ibb.co/nqVdXy8v/image-1.png") center/contain no-repeat;
  transform:translate(-50%,-50%) rotate(0deg);
  transition:transform 4s ease-out
}
.player{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:12px;font-weight:600
}
.host{color:#ffd86d}

#chat{
  width:90%;max-width:360px;
  margin:10px auto;
  background:#12121a;
  border-radius:8px;
  padding:6px
}
#messages{
  height:120px;overflow-y:auto;text-align:left;font-size:12px
}
</style>
</head>

<body>

<h1>Spin The Bottle</h1>

<div id="home">
  <button onclick="normalMode()">Normal Mode</button><br>
  <button onclick="multiMode()">Multiplayer</button>
</div>

<div id="normal" class="hidden">
  <input id="nName" placeholder="Player name">
  <button onclick="addN()">Add</button>
  <button onclick="startNormal()">Start</button>
</div>

<div id="multi" class="hidden">
  <button onclick="createRoom()">Create Room</button><br>
  <input id="joinCode" placeholder="Room Code">
  <button onclick="joinRoom()">Join</button>
</div>

<div id="lobby" class="hidden">
  <h3>Room <span id="roomCode"></span></h3>
  <input id="playerName" placeholder="Your name">
  <button onclick="joinGame()">Join Game</button>

  <div id="customBox" class="hidden">
    <input id="cTruth" placeholder="Add Truth">
    <button onclick="addTruth()">Add Truth</button><br>
    <input id="cDare" placeholder="Add Dare">
    <button onclick="addDare()">Add Dare</button>
  </div>

  <p id="playersList"></p>
  <button onclick="startGame()">Start Game</button>
</div>

<div id="game" class="hidden">
  <p id="turnInfo"></p>
  <div class="game-area" id="area">
    <div class="bottle" id="bottle"></div>
  </div>
  <h3 id="result">Waiting</h3>

  <div id="tdBox" class="hidden">
    <button onclick="pickTruth()">Truth</button>
    <button onclick="pickDare()">Dare</button>
  </div>

  <div id="chat">
    <div id="messages"></div>
    <input id="chatInput">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<audio id="spinSound">
  <source src="https://files.catbox.moe/x821vj.mp3">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"
import { getDatabase, ref, set, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"

const app=initializeApp({
  apiKey:"AIzaSyCXpP9X2KSEWK-KGshCTEBvFSmA4pK-mS8",
  databaseURL:"https://e-protocol-spin-the-bottle-default-rtdb.firebaseio.com"
})
const db=getDatabase(app)

const truths=[
"Sabse risky kaam kya kiya",
"Kis baat se darte ho",
"Kabhi jhooth bola bina reason",
"Instant regret kab hua",
"Kispe trust nahi",
"Kabhi rule todna fun laga",
"Kis habit se chutkara chahte ho",
"Kya tum overthink karte ho",
"Kis cheez pe control nahi",
"Truth ya Dare kya pasand"
]

const dares=[
"10 sec freeze",
"Naam ulta likho",
"Agle round mein bina soche choose",
"Serious face 5 sec",
"Kisi ko shoutout do",
"Emoji mein reply",
"Game ko 1 word mein batao",
"Deep breath lo",
"Hype banao",
"Sabko convince karo"
]

let roomId="",myName="",isHost=false
let players=[],turn=0,state="idle",rotation=0
let customTruths=[],customDares=[]

const params=new URLSearchParams(location.search)
if(params.get("room")) joinCode.value=params.get("room")

window.normalMode=()=>{home.classList.add("hidden");normal.classList.remove("hidden")}
window.multiMode=()=>{home.classList.add("hidden");multi.classList.remove("hidden")}

window.createRoom=()=>{
  roomId=Math.random().toString(36).slice(2,8).toUpperCase()
  isHost=true
  set(ref(db,"rooms/"+roomId),{
    players:[],host:"",turn:0,state:"idle",
    customTruths:[],customDares:[],started:false,messages:{}
  })
  openLobby()
}

window.joinRoom=()=>{
  roomId=joinCode.value.toUpperCase()
  openLobby()
}

function openLobby(){
  multi.classList.add("hidden")
  lobby.classList.remove("hidden")
  roomCode.innerText=roomId

  onValue(ref(db,"rooms/"+roomId),(s)=>{
    const d=s.val(); if(!d)return
    players=d.players||[]
    turn=d.turn||0
    state=d.state||"idle"
    customTruths=d.customTruths||[]
    customDares=d.customDares||[]

    playersList.innerHTML=players.map(p=>p.name+(p.name===d.host?" 👑":"")).join(", ")

    if(isHost && !d.started) customBox.classList.remove("hidden")
    if(d.started){ lobby.classList.add("hidden"); game.classList.remove("hidden"); renderPlayers(); updateTurn(); listenChat() }
  })
}

window.joinGame=()=>{
  myName=playerName.value.trim()
  if(!myName||players.find(p=>p.name===myName)||players.length>=20)return
  players.push({name:myName})
  update(ref(db,"rooms/"+roomId),{players:players,host:players[0].name})
}

window.addTruth=()=>{ if(isHost){ customTruths.push(cTruth.value); update(ref(db,"rooms/"+roomId),{customTruths}); cTruth.value=""}}
window.addDare=()=>{ if(isHost){ customDares.push(cDare.value); update(ref(db,"rooms/"+roomId),{customDares}); cDare.value=""}}

window.startGame=()=>{
  if(!isHost||players.length<2)return
  update(ref(db,"rooms/"+roomId),{started:true})
}

function renderPlayers(){
  area.innerHTML='<div class="bottle" id="bottle"></div>'
  const r=150,c=180,step=360/players.length
  players.forEach((p,i)=>{
    const a=(step*i-90)*Math.PI/180
    const d=document.createElement("div")
    d.className="player"
    d.style.left=c+r*Math.cos(a)+"px"
    d.style.top=c+r*Math.sin(a)+"px"
    d.innerText=p.name
    area.appendChild(d)
  })
}

function updateTurn(){
  turnInfo.innerText="Turn "+players[turn].name
  bottle.onclick=()=>{
    if(players[turn].name!==myName||state!=="idle")return
    spin()
  }
}

function spin(){
  const i=Math.floor(Math.random()*players.length)
  update(ref(db,"rooms/"+roomId),{state:"spinning",selected:i})
  spinSound.play()
  const angle=360/players.length*i+90
  rotation+=360*4+angle
  bottle.style.transform=`translate(-50%,-50%) rotate(${rotation}deg)`
  setTimeout(()=>{
    update(ref(db,"rooms/"+roomId),{state:"choosing"})
    tdBox.classList.remove("hidden")
  },4000)
}

window.pickTruth=()=>finish("Truth")
window.pickDare=()=>finish("Dare")

function finish(type){
  if(players[turn].name!==myName)return
  const list=(type==="Truth"?(customTruths.length?customTruths:truths):(customDares.length?customDares:dares))
  result.innerText=type+": "+list[Math.floor(Math.random()*list.length)]
  tdBox.classList.add("hidden")
  update(ref(db,"rooms/"+roomId),{turn:(turn+1)%players.length,state:"idle"})
}

function listenChat(){
  onValue(ref(db,"rooms/"+roomId+"/messages"),s=>{
    messages.innerHTML=""
    Object.values(s.val()||{}).forEach(m=>{
      messages.innerHTML+=`<div><b>${m.name}:</b> ${m.text}</div>`
    })
  })
}

window.sendMsg=()=>{
  const t=chatInput.value.trim()
  if(!t)return
  push(ref(db,"rooms/"+roomId+"/messages"),{name:myName,text:t})
  chatInput.value=""
}
</script>

</body>
</html>
